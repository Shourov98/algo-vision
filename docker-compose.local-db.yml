# =============================================================================
# AlgoVision — local docker-compose WITH local Postgres
# =============================================================================
# Use this when you want to develop entirely offline (no Supabase
# dependency). Run with:
#
#   docker compose -f docker-compose.local-db.yml up --build
#
# DATABASE_URL points at the local db service. pgcrypto + citext
# extensions are installed by the init script.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: algovision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algovision
    ports:
      - "5432:5432"
    volumes:
      - algovision-db-data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algovision-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algovision-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/algovision
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/algovision
      SECRET_KEY: ${SECRET_KEY:-dev-secret-replace-me-with-64-bytes-minimum-xxxxxxxx}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - algovision-net

volumes:
  algovision-db-data:

networks:
  algovision-net:
    driver: bridge