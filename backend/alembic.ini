# =============================================================================
# AlgoVision backend — Alembic configuration
# =============================================================================
# This file is read by the ``alembic`` CLI. The database URL is NOT
# hardcoded; ``migrations/env.py`` reads it from settings at runtime
# (via the application factory) or directly from the DATABASE_URL_SYNC
# env var when invoked via the CLI.
#
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html
# =============================================================================

[alembic]
# Path to the migration scripts directory (relative to backend/).
script_location = migrations

# Template for new migration filenames. Migration filenames follow the
# canonical ``NNNN_short_description.py`` form per DATABASE_DESIGN §6.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Search path for alembic config when running ``alembic`` from the
# backend directory.
prepend_sys_path = .

# Timezone for ``create_date`` columns. UTC everywhere.
timezone = UTC

# Max identifier length (PostgreSQL default is 63).
truncate_slug_length = 40

# Set in env.py.
sqlalchemy.url =

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S