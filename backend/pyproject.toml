[project]
name = "algovision-backend"
version = "0.1.0"
description = "AlgoVision backend API — interactive algorithm & data structure visualization platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

authors = [
    { name = "AlgoVision Team" },
]

keywords = ["algorithms", "data-structures", "visualization", "education", "fastapi"]

# ---------------------------------------------------------------------------
# Runtime dependencies
# Pinned to minor versions for reproducibility; bump deliberately.
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.33.0",          # ASGI server
    "python-multipart>=0.0.9",                     # form parsing (login, oauth)

    # Validation / settings
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "email-validator>=2.2.0",                      # EmailStr

    # Persistence
    "SQLAlchemy>=2.0.35,<2.1.0",                   # 2.x async ORM
    "asyncpg>=0.29.0,<0.31.0",                     # async PostgreSQL driver
    "alembic>=1.13.0,<2.0.0",                      # migrations
    "psycopg2-binary>=2.9.9",                      # sync driver for Alembic

    # Auth / security
    "argon2-cffi>=23.1.0,<24.0.0",                 # Argon2id password hashing
    "itsdangerous>=2.2.0",                         # signed session/refresh cookies
    "PyJWT>=2.9.0,<3.0.0",                         # access tokens (if used)

    # Logging / observability
    "structlog>=24.4.0,<25.0.0",                   # structured JSON logs

    # Rate limiting
    "slowapi>=0.1.9",

    # HTTP helpers (consumed by clients in tests, not by core domain)
    "httpx>=0.27.0",

    # Time / IDs
    "python-dateutil>=2.9.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",

    # Lint / format / types
    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # Dev utilities
    "ipython>=8.26.0",
    "watchfiles>=0.24.0",                          # uvicorn --reload
]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Strict-but-pragmatic: E/F (pycodestyle/pyflakes), I (isort), B (bugbear),
# UP (pyupgrade), SIM (simplify), RUF (ruff-native). Style choices deferred
# to formatter.
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by formatter + pre-commit
    "B008",  # FastAPI uses function calls in defaults; safe by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]   # asserts commonly look like bugs

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
# Practical, not strict. Missing-return/arg-type only as warnings.
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]